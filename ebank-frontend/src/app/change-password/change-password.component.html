<div class="col-md-5 offset-md-3">
  <div class="card">
    <div class="card-header"><i class="bi bi-key"></i> Changer le mot de passe ({{ authService.username }})</div>
    <div class="card-body">
      @if (message) { <div class="alert alert-success">{{ message }}</div> }
      @if (error) { <div class="alert alert-danger">{{ error }}</div> }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3"><label class="form-label">Mot de passe actuel</label><input class="form-control" type="password" formControlName="currentPassword"></div>
        <div class="mb-3"><label class="form-label">Nouveau mot de passe</label><input class="form-control" type="password" formControlName="newPassword"></div>
        <div class="mb-3"><label class="form-label">Confirmation</label><input class="form-control" type="password" formControlName="confirmPassword">
          @if (form.errors?.['mismatch'] && form.controls['confirmPassword'].touched) { <small class="text-danger">Les mots de passe ne correspondent pas</small> }
        </div>
        <button class="btn btn-primary" [disabled]="form.invalid">Modifier</button>
      </form>
    </div>
  </div>
</div>
