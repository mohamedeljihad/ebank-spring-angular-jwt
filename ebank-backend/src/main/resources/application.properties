spring.application.name=ebank-backend
server.port=8085

spring.datasource.url=jdbc:h2:mem:ebank-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

# Clé secrète HMAC pour signer les JWT (à surcharger en production : variable JWT_SECRET)
jwt.secret=${JWT_SECRET:9faa372517ac1d389758d3750fc07acf00f542277f26fec1ce4593e93f64e338}
jwt.expiration-minutes=30

# Spring AI / OpenAI : la clé n'est JAMAIS écrite ici, elle est lue dans la variable d'environnement OPENAI_API_KEY
spring.ai.openai.api-key=${OPENAI_API_KEY:no-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Chatbot Telegram (désactivé tant que le token n'est pas fourni)
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:ebank_enset_bot}

springdoc.swagger-ui.path=/swagger-ui.html
